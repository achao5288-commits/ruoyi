# 本地开发环境：仅启动 MySQL + Redis，供后端本地运行使用
# 用法：docker compose -f docker-compose.local.yml up -d
services:
  mysql:
    image: mysql:8
    container_name: yudao-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    volumes:
      - yudao-mysql-data:/var/lib/mysql
      - ./sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/ruoyi-vue-pro.sql:ro

  redis:
    image: redis:6-alpine
    container_name: yudao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - yudao-redis-data:/data

volumes:
  yudao-mysql-data:
  yudao-redis-data:
